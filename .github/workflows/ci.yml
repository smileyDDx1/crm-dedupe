name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and smoke run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test (with coverage report)
        run: ./mvnw -B -ntp verify

      # run the real jar end to end, the way a user would
      - name: Smoke test the jar
        run: |
          java -jar target/crm-dedupe.jar generate --people 20000 --seed 7 -o sample.csv
          java -jar target/crm-dedupe.jar find -i sample.csv -o out
          java -jar target/crm-dedupe.jar evaluate -i sample.csv | tee evaluation.txt

      - name: Upload the jar, coverage report and evaluation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crm-dedupe
          path: |
            target/crm-dedupe.jar
            target/site/jacoco
            evaluation.txt
          retention-days: 14
